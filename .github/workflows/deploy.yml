name: Development deployment bootstrap

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: Explicit codex/* branch to deploy to isolated development
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-development:
    name: Bootstrap development workflow from feature branch
    uses: ./.github/workflows/deploy-dev.yml
    with:
      branch: ${{ inputs.branch }}
    secrets: inherit

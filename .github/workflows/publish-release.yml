name: Publish curated GitHub Release

"on":
  push:
    tags:
      - "prod-v*"

permissions:
  contents: write

concurrency:
  group: satt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate tag and publish curated notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the immutable tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tag commit belongs to main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate version, tag, and curated notes
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/validate_release.py \
            --tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update the matching GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes_path }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$GITHUB_REF_NAME"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Salt All The Things $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Salt All The Things $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES"
          fi

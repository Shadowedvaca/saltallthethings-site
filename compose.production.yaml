name: satt-production

services:
  database:
    container_name: satt-production-database
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SATT_DB_NAME:?SATT_DB_NAME is required}
      POSTGRES_USER: ${SATT_DB_USER:?SATT_DB_USER is required}
      POSTGRES_PASSWORD: ${SATT_DB_PASSWORD:?SATT_DB_PASSWORD is required}
    volumes:
      - satt_production_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(head -n 1 \"$${PGDATA}/postmaster.pid\" 2>/dev/null)\" = \"1\" && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - satt

  app:
    container_name: satt-production-app
    build:
      context: .
      args:
        VCS_REF: ${COMMIT_SHA:?COMMIT_SHA is required}
    image: ${SATT_IMAGE:?SATT_IMAGE is required}
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_ENVIRONMENT: production
      SATT_DB_HOST: database
      SATT_DB_PORT: "5432"
      SATT_DB_NAME: ${SATT_DB_NAME:?SATT_DB_NAME is required}
      SATT_DB_USER: ${SATT_DB_USER:?SATT_DB_USER is required}
      SATT_DB_PASSWORD: ${SATT_DB_PASSWORD:?SATT_DB_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SITE_URL: https://saltallthethings.com
      CORS_ORIGINS: https://saltallthethings.com
      COMMIT_SHA: ${COMMIT_SHA:?COMMIT_SHA is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
    ports:
      - "127.0.0.1:${SATT_APP_PORT:?SATT_APP_PORT is required}:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    networks:
      - satt

volumes:
  satt_production_postgres:
    name: satt-production-postgres

networks:
  satt:

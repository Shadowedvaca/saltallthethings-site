name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application:
    name: Application, migrations, and isolated database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: satt_ci
          POSTGRES_USER: satt_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satt_ci -d satt_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PYTHONPATH: src
      CI_DB_HOST: 127.0.0.1
      CI_DB_PORT: "5432"
      CI_DB_USER: satt_ci
      CI_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q src/satt

      - name: Validate migrations and run the full safe suite
        run: python scripts/ci_validation.py

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js; do
            node --check "$file"
          done

  container:
    name: Production image and fresh-database health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the clean production image
        run: docker compose -f compose.ci.yaml build --pull app

      - name: Inspect image boundaries
        run: python scripts/verify_container_image.py

      - name: Start against a fresh isolated database
        run: docker compose -f compose.ci.yaml up -d --wait

      - name: Verify immutable runtime metadata
        run: |
          docker compose -f compose.ci.yaml exec -T app python -c \
            "import json, os, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); assert data['status']=='ok'; assert data['environment']=='test'; assert data['version']=='0.0.1'; assert data['commit']==os.environ['COMMIT_SHA']; assert set(data)=={'status','environment','version','commit','timestamp'}"

      - name: Show bounded diagnostics on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs --no-color --tail 100

      - name: Remove isolated CI resources
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans

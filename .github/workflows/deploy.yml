name: Deploy to Production (Hetzner)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rotate_exposed_database_credential:
        description: Rotate the exposed SATT database credential without displaying it
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || !inputs.rotate_exposed_database_credential }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key root@5.78.114.224 bash << 'ENDSSH'
            set -e
            cd /opt/satt-platform

            echo "=== Pulling latest code ==="
            git pull

            echo "=== Copying static files ==="
            cp *.html static/
            cp -r css/ js/ images/ static/

            echo "=== Restarting backend ==="
            systemctl restart satt
            systemctl is-active satt

            echo "=== Done ==="
          ENDSSH

  rotate-exposed-database-credential:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_exposed_database_credential }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Rotate credential and verify the old value is invalid
        run: |
          ssh -i ~/.ssh/deploy_key root@5.78.114.224 python3 - <<'PY'
          import hashlib
          import os
          import re
          import secrets
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote, unquote, urlsplit, urlunsplit

          env_path = Path("/opt/satt-platform/.env")
          env_text = env_path.read_text()
          match = re.search(r"(?m)^DATABASE_URL=(?P<quote>['\"]?)(?P<url>.+?)(?P=quote)\s*$", env_text)
          if not match:
              raise SystemExit("DATABASE_URL is not configured")

          database_url = match.group("url")
          parsed = urlsplit(database_url)
          username = unquote(parsed.username or "")
          old_password = unquote(parsed.password or "")
          if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", username):
              raise SystemExit("DATABASE_URL contains an unsupported database role")
          if not old_password:
              raise SystemExit("DATABASE_URL does not contain a password to rotate")

          documentation = Path("/opt/satt-platform/CLAUDE.md").read_text()
          documented_passwords = []
          for candidate in re.findall(r"postgresql(?:\+asyncpg)?://[^\s\"']+", documentation):
              candidate_password = urlsplit(candidate.rstrip("\\")).password
              if candidate_password:
                  documented_passwords.append(unquote(candidate_password))
          old_fingerprint = hashlib.sha256(old_password.encode()).digest()
          tracked_match = any(
              secrets.compare_digest(
                  hashlib.sha256(candidate.encode()).digest(),
                  old_fingerprint,
              )
              for candidate in documented_passwords
          )
          print(f"tracked_credential_matches_active={str(tracked_match).lower()}")

          new_password = secrets.token_hex(32)
          host = parsed.hostname or "127.0.0.1"
          port = str(parsed.port or 5432)
          database = parsed.path.lstrip("/")
          if not database:
              raise SystemExit("DATABASE_URL does not name a database")

          def psql_authenticates(password):
              command_env = os.environ.copy()
              command_env["PGPASSWORD"] = password
              result = subprocess.run(
                  [
                      "psql",
                      "--no-password",
                      "--host",
                      host,
                      "--port",
                      port,
                      "--username",
                      username,
                      "--dbname",
                      database,
                      "--command",
                      "SELECT 1",
                  ],
                  env=command_env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return result.returncode == 0

          def alter_role_password(password):
              sql_password = password.replace("'", "''")
              sql = f'ALTER ROLE "{username}" PASSWORD \'{sql_password}\';\n'
              subprocess.run(
                  [
                      "runuser",
                      "-u",
                      "postgres",
                      "--",
                      "psql",
                      "--set",
                      "ON_ERROR_STOP=1",
                      "--dbname",
                      "postgres",
                  ],
                  input=sql,
                  text=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )

          host_for_url = f"[{host}]" if ":" in host else host
          new_netloc = (
              f"{quote(username, safe='')}:{quote(new_password, safe='')}"
              f"@{host_for_url}"
          )
          if parsed.port:
              new_netloc += f":{parsed.port}"
          new_database_url = urlunsplit(
              (parsed.scheme, new_netloc, parsed.path, parsed.query, parsed.fragment)
          )
          replacement = (
              f"DATABASE_URL={match.group('quote')}{new_database_url}"
              f"{match.group('quote')}"
          )
          new_env_text = env_text[: match.start()] + replacement + env_text[match.end() :]

          try:
              alter_role_password(new_password)
              stat = env_path.stat()
              temporary_path = env_path.with_name(".env.codex-rotation")
              temporary_path.write_text(new_env_text)
              os.chmod(temporary_path, stat.st_mode)
              os.chown(temporary_path, stat.st_uid, stat.st_gid)
              os.replace(temporary_path, env_path)
              subprocess.run(
                  ["systemctl", "restart", "satt"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )
              for _ in range(20):
                  active = subprocess.run(
                      ["systemctl", "is-active", "--quiet", "satt"],
                      check=False,
                  ).returncode == 0
                  healthy = subprocess.run(
                      [
                          "curl",
                          "--fail",
                          "--silent",
                          "--show-error",
                          "http://127.0.0.1:8200/api/health",
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  ).returncode == 0
                  if active and healthy:
                      break
                  time.sleep(1)
              else:
                  raise RuntimeError("SATT did not become healthy after credential rotation")

              if not psql_authenticates(new_password):
                  raise RuntimeError("The replacement credential cannot authenticate")
              if psql_authenticates(old_password):
                  raise RuntimeError("The exposed credential still authenticates")
          except Exception:
              alter_role_password(old_password)
              env_path.write_text(env_text)
              subprocess.run(
                  ["systemctl", "restart", "satt"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              raise

          print("replacement_credential_authenticates=true")
          print("exposed_credential_authenticates=false")
          print("satt_service_active=true")
          print("satt_health_check_passed=true")
          PY

name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application:
    name: Application, migrations, and isolated database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: satt_ci
          POSTGRES_USER: satt_ci
          POSTGRES_PASSWORD: ci-only-database-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satt_ci -d satt_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PYTHONPATH: src
      CI_DB_HOST: 127.0.0.1
      CI_DB_PORT: "5432"
      CI_DB_USER: satt_ci
      CI_DB_PASSWORD: ci-only-database-placeholder
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q src/satt

      - name: Validate current release contract without publishing
        run: python scripts/validate_release.py

      - name: Validate migrations and run the full safe suite
        run: python scripts/ci_validation.py

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Test browser storage and credential-status contracts
        run: node scripts/test_frontend_contract.js

  container:
    name: Production image and fresh-database health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate current release contract without publishing
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release.py --github-output "$GITHUB_OUTPUT"

      - name: Build the clean production image
        run: docker compose -f compose.ci.yaml build --pull app

      - name: Inspect image boundaries
        run: python scripts/verify_container_image.py

      - name: Start against a fresh isolated database
        run: docker compose -f compose.ci.yaml up -d --wait

      - name: Verify immutable runtime metadata
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker compose -f compose.ci.yaml exec -T app python -c \
            "import json, os, sys, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); assert data['status']=='ok'; assert data['environment']=='test'; assert data['version']==sys.argv[1]; assert data['commit']==os.environ['COMMIT_SHA']; assert set(data)=={'status','environment','version','commit','timestamp'}" \
            "$EXPECTED_VERSION"
      - name: Verify final container database migration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.ci.yaml exec -T app \
            sh -c 'test -z "${DATABASE_URL:-}"'
          docker compose -f compose.ci.yaml exec -T app \
            alembic current --check-heads \
            < /dev/null
          revision="$(
            docker compose -f compose.ci.yaml exec -T database \
              sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select version_num from satt.alembic_version"'
          )"
          test "$revision" = "0006"

      - name: Exercise isolated migration rollback and recovery
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker compose -f compose.ci.yaml stop app
          docker compose -f compose.ci.yaml run --rm --no-deps \
            app alembic downgrade 0005
          revision="$(
            docker compose -f compose.ci.yaml exec -T database \
              sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select version_num from satt.alembic_version"'
          )"
          test "$revision" = "0005"

          docker compose -f compose.ci.yaml run --rm --no-deps \
            app alembic upgrade head
          revision="$(
            docker compose -f compose.ci.yaml exec -T database \
              sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select version_num from satt.alembic_version"'
          )"
          test "$revision" = "0006"
          docker compose -f compose.ci.yaml up -d --wait app
          docker compose -f compose.ci.yaml exec -T app python -c \
            "import json, os, sys, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); assert data['status']=='ok'; assert data['environment']=='test'; assert data['version']==sys.argv[1]; assert data['commit']==os.environ['COMMIT_SHA']" \
            "$EXPECTED_VERSION"

      - name: Exercise isolated production backup restore
        shell: bash
        run: |
          set -euo pipefail
          restore_dump="$RUNNER_TEMP/satt-production-restore.dump"
          before_fingerprint="$(
            docker compose -f compose.ci.yaml exec -T \
              -e ENVIRONMENT=production \
              -e DATABASE_ENVIRONMENT=production \
              app python -m satt.scripts.production_fingerprint \
              < /dev/null
          )"
          docker compose -f compose.ci.yaml exec -T database sh -c \
            'exec pg_dump --format=custom --schema=satt --no-owner --no-privileges --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"' \
            > "$restore_dump"
          test -s "$restore_dump"
          docker compose -f compose.ci.yaml exec -T database \
            pg_restore --list < "$restore_dump" >/dev/null

          docker compose -f compose.ci.yaml stop app
          docker compose -f compose.ci.yaml rm -sf database
          docker compose -f compose.ci.yaml up -d --wait database
          docker compose -f compose.ci.yaml exec -T database sh -c \
            'exec pg_restore --exit-on-error --no-owner --no-privileges --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"' \
            < "$restore_dump" >/dev/null
          restored_fingerprint="$(
            docker compose -f compose.ci.yaml run --rm --no-deps \
              -e ENVIRONMENT=production \
              -e DATABASE_ENVIRONMENT=production \
              --entrypoint python app \
              -m satt.scripts.production_fingerprint \
              < /dev/null
          )"
          test "$before_fingerprint" = "$restored_fingerprint"
          docker compose -f compose.ci.yaml up -d --wait app
          after_fingerprint="$(
            docker compose -f compose.ci.yaml exec -T \
              -e ENVIRONMENT=production \
              -e DATABASE_ENVIRONMENT=production \
              app python -m satt.scripts.production_fingerprint \
              < /dev/null
          )"
          test "$before_fingerprint" = "$after_fingerprint"
      - name: Exercise isolated runtime recovery after health mismatch
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          COMMIT_SHA=recovery-prior \
            docker compose -f compose.ci.yaml up -d --force-recreate --wait app
          COMMIT_SHA=recovery-prior \
            docker compose -f compose.ci.yaml exec -T app python -c \
              "import json, os, sys, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); assert data['status']=='ok'; assert data['environment']=='test'; assert data['version']==sys.argv[1]; assert data['commit']==os.environ['COMMIT_SHA']" \
              "$EXPECTED_VERSION"

          docker compose -f compose.ci.yaml stop app
          COMMIT_SHA=recovery-candidate \
            docker compose -f compose.ci.yaml up -d --force-recreate --wait app
          if COMMIT_SHA=recovery-candidate \
            docker compose -f compose.ci.yaml exec -T app python -c \
              "import json, sys, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); assert data['commit']==sys.argv[1]" \
              forced-health-mismatch; then
            echo "The forced post-start health mismatch unexpectedly passed" >&2
            exit 1
          fi

          docker compose -f compose.ci.yaml stop app
          COMMIT_SHA=recovery-prior \
            docker compose -f compose.ci.yaml up -d --force-recreate --wait app
          COMMIT_SHA=recovery-prior \
            docker compose -f compose.ci.yaml exec -T app python -c \
              "import json, os, sys, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); assert data['status']=='ok'; assert data['environment']=='test'; assert data['version']==sys.argv[1]; assert data['commit']==os.environ['COMMIT_SHA']" \
              "$EXPECTED_VERSION"
      - name: Show bounded diagnostics on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs --no-color --tail 100

      - name: Remove isolated CI resources
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans

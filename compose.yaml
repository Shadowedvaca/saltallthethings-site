services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SATT_DB_NAME:-satt_local}
      POSTGRES_USER: ${SATT_DB_USER:-satt_local}
      POSTGRES_PASSWORD: ${SATT_DB_PASSWORD:-local-only-change-me}
    volumes:
      - satt_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - satt

  app:
    build:
      context: .
      args:
        VCS_REF: ${COMMIT_SHA:-unknown}
    image: ${SATT_IMAGE:-satt:local}
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_ENVIRONMENT: ${DATABASE_ENVIRONMENT:-local}
      SATT_DB_HOST: database
      SATT_DB_PORT: "5432"
      SATT_DB_NAME: ${SATT_DB_NAME:-satt_local}
      SATT_DB_USER: ${SATT_DB_USER:-satt_local}
      SATT_DB_PASSWORD: ${SATT_DB_PASSWORD:-local-only-change-me}
      SECRET_KEY: ${SECRET_KEY:-local-only-change-me}
      SITE_URL: ${SITE_URL:-http://localhost:8200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8200}
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      ALLOW_NONPRODUCTION_EXTERNAL_SERVICES: ${ALLOW_NONPRODUCTION_EXTERNAL_SERVICES:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    networks:
      - satt

volumes:
  satt_postgres:

networks:
  satt:

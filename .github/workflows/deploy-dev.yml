name: Deploy development

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to isolated development
        required: true
        type: string
  workflow_call:
    inputs:
      branch:
        description: Branch to deploy to isolated development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: satt-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact branch commit to development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}

    steps:
      - name: Validate explicit branch
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            codex/*) ;;
            *)
              echo "Development deployments require an explicit codex/* branch."
              exit 1
              ;;
          esac

      - name: Resolve branch to immutable commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Record immutable commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure strict SSH trust
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEV_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEV_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEV_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Deploy isolated development
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$DEV_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          deploy_sha="$1"
          if ! printf '%s\n' "$deploy_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: invalid deployment commit"
            exit 1
          fi

          cd /opt/satt-platform
          test -f .env
          test "$(stat -c '%a' .env)" = "600"

          git fetch --no-tags --prune origin
          git checkout --detach "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"

          compose() {
            COMMIT_SHA="$deploy_sha" docker compose \
              --env-file .env \
              -f compose.yaml \
              -f compose.development.yaml \
              "$@"
          }

          install -d -m 0700 /opt/satt-platform/backups
          if compose ps --status running --services | grep -qx database; then
            backup="/opt/satt-platform/backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            compose exec -T database \
              sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
              < /dev/null | gzip -c > "$backup"
            chmod 0600 "$backup"
            find /opt/satt-platform/backups \
              -maxdepth 1 -type f -name 'pre-deploy-*.sql.gz' -mtime +14 -delete
          fi

          failure_logs() {
            echo "==> Bounded SATT development diagnostics"
            compose ps || true
            compose logs --no-color --tail 100 app database || true
          }
          trap failure_logs EXIT

          compose build --pull app
          compose up -d --wait --remove-orphans database app

          health="$(
            curl --fail --silent --show-error \
              --retry 6 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:8300/api/health
          )"
          printf '%s' "$health" | python3 -c \
            'import json,sys; expected=sys.argv[1]; data=json.load(sys.stdin); assert data["status"]=="ok"; assert data["environment"]=="development"; assert data["version"]=="0.0.1"; assert data["commit"]==expected' \
            "$deploy_sha"

          trap - EXIT
          echo "Development deploy verified at commit $deploy_sha"
          REMOTE

      - name: Verify public development health
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            https://dev.saltallthethings.com/api/health \
            | python -c \
              'import json,sys; expected=sys.argv[1]; data=json.load(sys.stdin); assert data["status"]=="ok"; assert data["environment"]=="development"; assert data["version"]=="0.0.1"; assert data["commit"]==expected' \
              "$DEPLOY_SHA"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

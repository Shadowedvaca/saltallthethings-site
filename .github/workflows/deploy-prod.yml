name: Deploy production

"on":
  push:
    tags:
      - "prod-v*"

permissions: {}

concurrency:
  group: satt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated production tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag }}
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}

    steps:
      - name: Check out immutable production tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release and immutable commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          python scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"
          sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$sha" = "$GITHUB_SHA"
          test "$sha" = "$tag_sha"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify exact commit passed test promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          runs_file="$RUNNER_TEMP/satt-test-promotion-$TESTED_SHA.json"
          trap 'rm -f "$runs_file"' EXIT

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-test.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f head_sha="$TESTED_SHA" \
            -f per_page=100 \
            > "$runs_file"

          python - "$runs_file" "$TESTED_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          runs_path = Path(sys.argv[1])
          tested_sha = sys.argv[2]
          runs = json.loads(runs_path.read_text(encoding="utf-8")).get(
              "workflow_runs", []
          )
          matches = [
              run
              for run in runs
              if run.get("path") == ".github/workflows/deploy-test.yml"
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == tested_sha
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit(
                  "Production blocked: no successful exact-SHA test promotion "
                  f"for {tested_sha}"
              )
          verified = max(matches, key=lambda run: run.get("run_attempt", 0))
          print(
              "Verified exact-SHA test promotion: "
              f"run_id={verified['id']} url={verified['html_url']}"
          )
          PY

          rm -f "$runs_file"
          trap - EXIT

      - name: Configure strict SSH trust
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Deploy production release
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_TAG: ${{ steps.release.outputs.tag }}
          DEPLOY_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$PROD_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$DEPLOY_TAG' '$DEPLOY_VERSION'" <<'REMOTE'
          set -euo pipefail

          deploy_sha="$1"
          deploy_tag="$2"
          expected_version="$3"
          repository="/opt/satt-platform"

          printf '%s\n' "$deploy_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$deploy_tag" | grep -Eq '^prod-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$deploy_tag" = "prod-v$expected_version"
          test -d "$repository/.git"

          cd "$repository"
          previous_sha="$(git rev-parse HEAD)"
          git fetch --tags --no-force origin "$deploy_tag"
          test "$(git rev-list -n 1 "$deploy_tag")" = "$deploy_sha"
          git checkout --detach "$deploy_tag"
          test "$(git rev-parse HEAD)" = "$deploy_sha"

          set +e
          bash scripts/production_deploy.sh \
            "$deploy_sha" \
            "$deploy_tag" \
            "$expected_version" \
            "$previous_sha"
          status="$?"
          set -e
          if test "$status" -ne 0; then
            git checkout --detach "$previous_sha" || true
            exit "$status"
          fi
          REMOTE

      - name: Verify public production health
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            https://saltallthethings.com/api/health \
            | python -c \
              'import json,sys; version,commit=sys.argv[1:3]; data=json.load(sys.stdin); assert data["status"]=="ok"; assert data["environment"]=="production"; assert data["version"]==version; assert data["commit"]==commit' \
              "$DEPLOY_VERSION" \
              "$DEPLOY_SHA"

      - name: Collect bounded diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$PROD_HOST" \
            "docker ps --filter name=satt-production-app && docker logs --tail 100 satt-production-app" \
            || true

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

  publish:
    name: Publish verified production release
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      release_sha: ${{ needs.deploy.outputs.release_sha }}
      release_tag: ${{ needs.deploy.outputs.release_tag }}

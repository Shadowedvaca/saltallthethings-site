name: satt-ci

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: satt_ci
      POSTGRES_USER: satt_ci
      POSTGRES_PASSWORD: ci-only-database-placeholder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satt_ci -d satt_ci"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build:
      context: .
      args:
        VCS_REF: ${COMMIT_SHA:-ci}
    image: satt:ci
    depends_on:
      database:
        condition: service_healthy
    environment:
      ENVIRONMENT: test
      DATABASE_ENVIRONMENT: test
      SATT_DB_HOST: database
      SATT_DB_PORT: "5432"
      SATT_DB_NAME: satt_ci
      SATT_DB_USER: satt_ci
      SATT_DB_PASSWORD: ci-only-database-placeholder
      SECRET_KEY: ci-only-signing-placeholder-at-least-32-characters
      SITE_URL: http://app:8200
      CORS_ORIGINS: http://app:8200
      COMMIT_SHA: ${COMMIT_SHA:-ci}
      ALLOW_NONPRODUCTION_EXTERNAL_SERVICES: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=2)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
